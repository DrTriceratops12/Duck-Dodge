<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Dodge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game-shell">
    <h1>Duck Dodge</h1>

    <canvas id="game" width="800" height="520"></canvas>

    <!-- Difficulty buttons. You can rename them here; game.js only looks at data-level. -->
    <div class="level-picker">
      <button class="level-btn" data-level="easy">Duckling<small>Easy</small></button>
      <button class="level-btn selected" data-level="normal">Quacker<small>Normal</small></button>
      <button class="level-btn" data-level="hard">Rock Storm<small>Hard</small></button>
    </div>

    <p class="hint keyboard-hint">Move with the arrow keys or A / D. Press Space to start or restart.</p>
    <p class="hint touch-hint">Tap the game to start. Hold the arrow buttons to move.</p>

    <!-- Arrow buttons for phones and tablets (style.css hides them on laptops) -->
    <div class="touch-controls">
      <button id="left-btn" class="arrow-btn" aria-label="Move left">
        <svg viewBox="0 0 24 24"><polygon points="16,4 6,12 16,20" /></svg>
      </button>
      <button id="right-btn" class="arrow-btn" aria-label="Move right">
        <svg viewBox="0 0 24 24"><polygon points="8,4 18,12 8,20" /></svg>
      </button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
